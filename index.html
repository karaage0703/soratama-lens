<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="写真と動画を端末内で宙玉レンズ風に。WebGLによるリアルタイム編集。">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data:; connect-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; object-src 'none'; base-uri 'none'">
<title>Soratama Lens — 光を、ひとつの球に。</title>
<link rel="stylesheet" href="style.css"><script src="app.js" defer></script>
</head>
<body>
<header><a class="brand" href="./index.html"><span class="mark" aria-hidden="true">◉</span> Soratama <span>LENS</span></a><span class="local">端末内で処理 · アップロードなし</span></header>
<main>
<div class="intro"><div><p class="eyebrow">SORATAMA / LOCAL LENS LAB</p><h1>光を、ひとつの球に。</h1><p>写真や動画を開いて、宙玉レンズの世界へ。</p></div><button id="open" class="primary">画像・動画を開く <span aria-hidden="true">↗</span></button><input type="file" id="file" accept="image/*,video/*" hidden></div>
<div class="workspace">
<section class="viewer" aria-label="プレビュー">
<div class="viewbar"><span id="filename">サンプル風景</span><span id="dimensions"></span></div>
<div id="dropzone"><canvas id="canvas" width="1280" height="800" aria-label="宙玉プレビュー。ドラッグで球の位置を変更できます。"></canvas></div>
<div class="viewbar bottom"><span>ドラッグで宙玉を移動 · ファイルをドロップ</span><span id="renderer">WebGL準備中</span></div>
<div id="transport" hidden><button id="play" aria-label="動画の再生・一時停止">再生</button><input id="seek" type="range" min="0" max="1" step="0.01" value="0" aria-label="動画の再生位置"><output id="time">0:00 / 0:00</output></div>
<p id="status" role="status" aria-live="polite">サンプルを準備しています。</p>
<a id="download" hidden download>保存したファイルをダウンロード</a>
</section>
<aside aria-label="エフェクトの調整">
<div class="panelheading"><h2>レンズをつくる</h2><button id="reset" class="textbutton">リセット</button></div>
<fieldset id="settings"><legend class="sr-only">宙玉の調整</legend>
<label for="radius">宙玉の大きさ <output id="radiusOut"></output></label><input id="radius" type="range" min="10" max="95" value="64">
<label for="zoom">球の中の倍率 <output id="zoomOut"></output></label><input id="zoom" type="range" min="60" max="240" value="110">
<label for="distortion">球面の歪み <output id="distortionOut"></output></label><input id="distortion" type="range" min="0" max="100" value="55">
<label for="blur">背景のぼかし <output id="blurOut"></output></label><input id="blur" type="range" min="0" max="100" value="45">
<label for="shine">ガラスの光沢 <output id="shineOut"></output></label><input id="shine" type="range" min="0" max="100" value="35">
<div class="positions"><div><label for="posX">横位置 <output id="posXOut"></output></label><input id="posX" type="range" min="0" max="100" value="50"></div><div><label for="posY">縦位置 <output id="posYOut"></output></label><input id="posY" type="range" min="0" max="100" value="50"></div></div>
<label class="check"><input id="invert" type="checkbox" checked> 球の中を上下・左右反転</label>
<label class="check"><input id="original" type="checkbox"> 元の映像と比較</label>
<label for="quality">出力サイズ（長辺）</label><select id="quality"><option value="1280">1280 px · 軽快</option><option value="1920" selected>1920 px · 標準</option><option value="3840">3840 px · 高精細</option></select>
</fieldset>
<div class="exports"><button id="png" class="primary">画像を保存 <span>PNG ↓</span></button><label class="check"><input id="audio" type="checkbox" checked> 動画保存に元の音声を含める</label><button id="record">動画を先頭から保存</button><button id="stop" hidden>ここまでを保存して終了</button><p class="hint">動画は再生時間と同じ長さで保存。プレビューは無音です。保存中はこのタブを表示してください。</p></div>
<button id="demo" class="textbutton">サンプルに戻す</button>
</aside>
</div>
<footer><span>2012年のアイデアを、ブラウザの中へ。</span><a href="https://karaage.hatenadiary.jp/entry/20120614/1339683656" target="_blank" rel="noreferrer">からあげの宙玉エフェクト原点 ↗</a></footer>
</main>
<noscript>このアプリを使うにはJavaScriptを有効にしてください。</noscript>
</body></html>
